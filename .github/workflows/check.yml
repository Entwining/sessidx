name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny
      # Homebrew bottles ship this package's license notices, so a license
      # the configuration cannot place would otherwise fail only at release.
      - name: Build the package
        run: |
          make build OUT="$RUNNER_TEMP/package"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$("$RUNNER_TEMP/package/bin/sessidx" --version)" = "sessidx $version"
          test -s "$RUNNER_TEMP/package/LICENSE-THIRD-PARTY.md"
      - name: Test
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked
