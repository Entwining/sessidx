name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # git ignores every changed line when the -I pattern can match an empty
      # string, so the pattern ends in the line's newline.
      # Rule: docs/formats.md `parser_version`.
      - name: Check the parser version
        run: |
          release=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          parser() { git show "$1:src/store.rs" | sed -n 's/^pub const PARSER_VERSION: i64 = \(.*\);$/\1/p'; }
          brush() { git show "$1:Cargo.lock" | sed -n '/^name = "brush-parser"$/{n;p;}'; }
          old_parser=$(parser "$release") new_parser=$(parser HEAD) old_brush=$(brush "$release") new_brush=$(brush HEAD)
          if test -z "$old_parser" || test -z "$new_parser" || test -z "$old_brush" || test -z "$new_brush"; then
            echo "Cannot read PARSER_VERSION or the brush-parser version at $release or HEAD" >&2
            exit 1
          fi
          if { ! git diff --quiet -I$'^[[:blank:]]*(//.*)?\n' "$release" HEAD -- src/adapters src/code_mode.rs src/model.rs src/normalize.rs src/outcomes.rs src/redaction.rs src/shell.rs src/source.rs \
            || test "$old_brush" != "$new_brush"; } \
            && test "$old_parser" = "$new_parser"; then
            echo "Parser sources or Brush changed since $release; raise PARSER_VERSION in src/store.rs" >&2
            exit 1
          fi
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
        env:
          # renovate: datasource=crate depName=cargo-deny
          CARGO_DENY_VERSION: 0.20.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
        env:
          # renovate: datasource=crate depName=cargo-about
          CARGO_ABOUT_VERSION: 0.9.2
      - name: Lint workflows
        run: |
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION#v}_darwin_arm64.tar.gz"
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "${archive##*/}" --output "$archive"
          gh attestation verify "$archive" --repo rhysd/actionlint
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
        env:
          GH_TOKEN: ${{ github.token }}
          # renovate: datasource=go depName=github.com/rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny
      # Homebrew bottles ship this package's license notices, so a license
      # the configuration cannot place would otherwise fail only at release.
      - name: Build the package
        run: |
          make build OUT="$RUNNER_TEMP/package"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$("$RUNNER_TEMP/package/bin/sessidx" --version)" = "sessidx $version"
          test -s "$RUNNER_TEMP/package/LICENSE-THIRD-PARTY.md"
      - name: Test
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked
