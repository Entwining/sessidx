name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Rows an earlier parser indexed are reindexed only when PARSER_VERSION
      # changes, so parser sources that differ from the last release's need a
      # new one. Rule: docs/formats.md `parser_version`.
      - name: Check the parser version
        run: |
          release=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          parser() { git show "$1:src/store.rs" | sed -n 's/^pub const PARSER_VERSION: i64 = \(.*\);$/\1/p'; }
          if ! git diff --quiet "$release" HEAD -- src/adapters src/code_mode.rs src/model.rs src/normalize.rs src/outcomes.rs src/redaction.rs src/shell.rs src/source.rs \
            && test "$(parser "$release")" = "$(parser HEAD)"; then
            echo "Parser sources changed since $release; raise PARSER_VERSION in src/store.rs" >&2
            exit 1
          fi
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny
      # Homebrew bottles ship this package's license notices, so a license
      # the configuration cannot place would otherwise fail only at release.
      - name: Build the package
        run: |
          make build OUT="$RUNNER_TEMP/package"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$("$RUNNER_TEMP/package/bin/sessidx" --version)" = "sessidx $version"
          test -s "$RUNNER_TEMP/package/LICENSE-THIRD-PARTY.md"
      - name: Test
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked
