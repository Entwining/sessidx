name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Check dependencies
        run: cargo deny --locked check
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
        env:
          CARGO_BUILD_WARNINGS: deny
      # The Homebrew formula renders this file into each bottle; a license the
      # configuration cannot place would otherwise fail only at release.
      # cargo metadata needs every target's crates, which no build fetches.
      # cargo-about only logs a dropped notice, such as a clarification whose
      # checksum no longer matches, so any warning or error fails the step.
      - name: Render third-party licenses
        run: |
          cargo fetch --locked
          log="$RUNNER_TEMP/cargo-about.log"
          cargo about generate --frozen --fail -o "$RUNNER_TEMP/LICENSE-THIRD-PARTY.md" about.hbs 2> "$log" || { cat "$log" >&2; exit 1; }
          cat "$log" >&2
          if grep -Eq 'WARN|ERROR' "$log"; then exit 1; fi
      - name: Test
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked
