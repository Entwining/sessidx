name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version" && test "$GITHUB_REF_NAME" = "v$version"
          test -s "docs/releases/$version.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An existing release is a completed write; continue only with its tap notification.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'Release %s already exists; skipping creation\n' "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
              --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ vars.TAP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: Entwining
          repositories: homebrew-tap
      - name: Ask the tap to pick up this version
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: gh api repos/Entwining/homebrew-tap/dispatches -f event_type=sessidx-release
