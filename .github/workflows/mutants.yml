name: Mutants

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants@27.1.0
      - name: Test mutants in the changed lines
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/$GITHUB_BASE_REF..." > git.diff
          cargo mutants --no-shuffle -j 2 --in-diff git.diff
      - name: Test every mutant
        if: github.event_name != 'pull_request'
        run: cargo mutants --no-shuffle -j 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out
