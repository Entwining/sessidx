[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0"]
exceptions = [
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # zstd-sys compiles the zstd C library, which is BSD-3-Clause or GPLv2; these
    # crates take its BSD-3-Clause side.
    { allow = ["BSD-3-Clause"], crate = "zstd" },
    { allow = ["BSD-3-Clause"], crate = "zstd-safe" },
    { allow = ["BSD-3-Clause"], crate = "zstd-sys" },
]

[bans]
# brush-parser's dependency tree brings duplicate versions this crate cannot
# unify; a warning nobody can act on would bury real output.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
