[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0"]
exceptions = [
    { allow = ["Zlib"], crate = "foldhash" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    # The zstd C library is BSD-3-Clause or GPLv2. zstd-sys and zstd-safe declare
    # BSD-3-Clause too, as zstd does from 0.14; until zstd 0.14 is taken, the zstd
    # entry matches nothing and cargo deny warns about it.
    { allow = ["BSD-3-Clause"], crate = "zstd" },
    { allow = ["BSD-3-Clause"], crate = "zstd-safe" },
    { allow = ["BSD-3-Clause"], crate = "zstd-sys" },
]

[bans]
# Each duplicate pair has one side inside brush-parser's dependency tree, which
# this crate cannot unify; a warning nobody can act on would bury real output.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
