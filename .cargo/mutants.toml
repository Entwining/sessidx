# Mutants that cannot change behavior on any input sessidx can receive, with
# the reason for each. A pattern also hides every future mutant it matches, so
# keep each one as narrow as the mutant names allow.
exclude_re = [
  # Defensive 256 KiB source caps: only an input of exactly 256 KiB, or one
  # above it, behaves differently, and no recorded command approaches the cap.
  'src/(code_mode|shell)\.rs:\d+:\d+: replace > with (==|>=) in sites',
  # Depth-64 traversal guards: each guard is backed by its neighbours, so these
  # only move the nesting level at which a command becomes unparsed.
  'src/shell\.rs:\d+:\d+: replace > with (==|>=) in (program|walk_list|walk_command)',
  'src/shell\.rs:\d+:\d+: replace \+ with \* in (program|walk_list|words)',
  'src/shell\.rs:\d+:\d+: replace \+ with - in words',
  # Depth-32 guard on outcome traversal: these move the nesting level at which
  # a value stays unclassified, or (depth * 1) disable the guard. Real outputs
  # nest a few levels; without the guard, parsed values stay bounded by
  # serde_json's depth limit and re-parsed strings by their escaping growth.
  'src/outcomes\.rs:\d+:\d+: replace > with (==|>=) in structured',
  'src/outcomes\.rs:\d+:\d+: replace \+ with \* in structured',
  # The pre-redaction append cap only bounds work; output_prefix clips the
  # redacted text again at the limit and recomputes the truncation flag.
  'src/normalize\.rs:\d+:\d+: replace - with \+ in output_prefix::append',
  # JavaScript \0 escapes: no recorded cmd literal contains one.
  'src/code_mode\.rs:\d+:\d+: replace match guard !chars\.peek\(\)\.is_some_and\(\|c\| c\.is_ascii_digit\(\)\) with (true|false) in literal',
  'src/code_mode\.rs:\d+:\d+: delete ! in literal',
  # For failures the call-id join selects the same command rows as the
  # event-local test, because every shell call carries a native call ID. The
  # column keeps the caught arm deletion in the outcome expression testable.
  'src/counting\.rs:\d+:13: delete match arm "failures" in count',
  # A real interrupt always comes after the deadline; only an injected
  # non-interrupt SQLite failure mid-scan tells these guards apart.
  'replace match guard e\.code == rusqlite::ErrorCode::OperationInterrupted && Instant::now\(\) >= deadline with true in scan',
  'src/query\.rs:\d+:\d+: replace && with \|\| in scan',
  # The read limit differs only when a file grows between stat and read, and the
  # next refresh resumes from the indexed offset either way.
  'src/store\.rs:\d+:\d+: replace - with \+ in Store::index_file',
  # A reader that never reports end of input hangs; the timeout is the detection.
  'replace read_record -> Result<\(u64, bool, bool\)> with Ok\(\(1, true, (true|false)\)\)',
]
