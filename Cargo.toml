[package]
name = "sessidx"
version = "0.0.17"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"
repository = "https://github.com/Entwining/sessidx"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
too_many_lines = "warn"

[dependencies]
brush-parser = "=0.4.0"
rusqlite = { version = "=0.43.0", features = ["bundled", "fallible_uint", "functions", "hooks"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde = { version = "=1.0.229", features = ["derive"] }
anyhow = "=1.0.104"
regex = "=1.13.1"
jiff = { version = "=0.2.43", default-features = false, features = ["std", "serde"] }
sha2 = { version = "=0.11.1", default-features = false }
walkdir = "=2.5.0"
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
zstd = { version = "=0.14.4", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

[[example]]
name = "measure"
test = true

[[example]]
name = "leaks"
test = true

[profile.mutants]
inherits = "test"
debug = "none"
