[package]
name = "sessidx"
version = "0.0.2"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/Entwining/sessidx"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"

[dependencies]
brush-parser = "=0.4.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint", "hooks"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
serde = { version = "=1.0.229", features = ["derive"] }
anyhow = "=1.0.104"
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
sha2 = { version = "=0.11.0", default-features = false }
walkdir = "=2.5.0"
clap = { version = "=4.6.7", features = ["derive"] }
hex = "=0.4.3"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
